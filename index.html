<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<title>BesichtigungsApp</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:21px;margin:0 0 12px}h3{margin:18px 0 8px}.muted{color:#6b7280;font-size:14px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}.small{padding:9px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statusgrid{grid-template-columns:1fr 1fr}.statusgrid label{display:flex!important;align-items:center;gap:8px;width:auto;margin:3px 0;font-weight:500}.statuslist{display:flex;flex-direction:column;gap:7px}.statusrow{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:8px;align-items:center;border:1px solid #e5e7eb;border-radius:11px;padding:8px 10px;background:#fff}.statuscheck{display:flex;align-items:center;gap:8px;margin:0!important;font-weight:500!important;font-size:15px!important}.statusaction{padding:9px;font-size:15px}.statusaction:disabled{opacity:.5}@media(max-width:500px){.statusrow{grid-template-columns:minmax(0,1fr) 132px}}
label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white}input[type="checkbox"]{width:22px!important;height:22px;padding:0;margin:0;flex:0 0 22px;border-radius:6px}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spacer{flex:1}.hidden{display:none}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.item{border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:8px 0}.item strong{display:block}.pill{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:999px;font-size:12px;margin:3px 3px 0 0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.topbar button{padding:8px 11px}
.total{font-size:22px;font-weight:800}.nav{position:sticky;bottom:10px;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid #ddd;border-radius:16px;padding:8px;display:flex;gap:6px;margin-top:18px}.nav button{flex:1}
@media(max-width:500px){.grid3{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.statusgrid{grid-template-columns:1fr}}

.photoCatCard{border:1px solid #e5e7eb;border-radius:13px;padding:10px;margin:8px 0;background:#fff}
.photoCatHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.photoCatHead span{font-size:12px;color:#6b7280}
.cameraBtn{width:100%;background:#111827;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:8px}
.emptyCat{padding:6px 0 2px}

.damage-toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.damage-list{display:grid;gap:10px;margin-top:10px}
.damage-item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fafafa}
.damage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.damage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.damage-grid label{margin-top:0}
 .damage-remove{white-space:nowrap}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.report-actions button{flex:1;min-width:180px}.report-page{background:#fff;color:#111827}.report-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #111827;padding-bottom:12px;margin-bottom:16px}.report-logo{font-size:22px;font-weight:800}.report-meta{text-align:right;font-size:13px}.report-section{border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:10px 0;break-inside:avoid}.report-section h3{margin:0 0 8px}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th,.report-table td{border:1px solid #d1d5db;padding:6px;text-align:left;vertical-align:top}.report-table th{background:#f3f4f6}.report-photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.report-photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #d1d5db;border-radius:4px}.report-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:35px}.report-sign div{border-top:1px solid #6b7280;padding-top:6px;font-size:12px}@media print{body{background:#fff!important}.wrap{max-width:none;padding:0}.nav{display:none!important}.no-print{display:none!important}.report-page{display:block!important}.report-actions{display:none!important}.report-section{break-inside:avoid}.report-photo-grid img{break-inside:avoid}}
@media(max-width:520px){.damage-grid{grid-template-columns:1fr}.damage-toolbar{grid-template-columns:1fr}.damage-toolbar button{width:100%}}

</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
<div class="nav">
<button class="secondary" onclick="home()">🏠 Start</button>
<button class="secondary" onclick="listInspections()">📋 Besichtigungen</button>
<button class="secondary" onclick="listWorkshops()">🏭 Werkstätten</button>
</div>
</div>
<script>
const KEY="besichtigungsapp_v2";
let db=JSON.parse(localStorage.getItem(KEY)||'{"workshops":[],"inspections":[]}');
let currentPhotos=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function nextGutachtenNr(){
  const year=new Date().getFullYear();
  const nums=db.inspections.map(x=>String(x.gutachtenNr||'').match(new RegExp('^GA-'+year+'-(\\d+)$'))).filter(Boolean).map(m=>+m[1]);
  return `GA-${year}-${String((nums.length?Math.max(...nums):0)+1).padStart(4,'0')}`;
}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CAR_MAKES=["Abarth","Alfa Romeo","Alpine","Aston Martin","Audi","Bentley","BMW","BYD","Cadillac","Chevrolet","Chrysler","Citroën","Cupra","Dacia","Daewoo","Daihatsu","Dodge","DS Automobiles","Ferrari","Fiat","Ford","Genesis","Honda","Hyundai","Infiniti","Isuzu","Iveco","Jaguar","MAN","DAF","Jeep","Kia","Lada","Lamborghini","Lancia","Land Rover","Lexus","Lotus","Maserati","Mazda","McLaren","Mercedes-Benz","MG","Mini","Mitsubishi","Nissan","Opel","Peugeot","Polestar","Porsche","Renault","Rolls-Royce","Rover","Saab","Seat","Škoda","Smart","Subaru","Suzuki","Tesla","Toyota","Volkswagen","Volvo","Andere"];
const CAR_MODELS={"Abarth":["500","595","695","124 Spider"],"Alfa Romeo":["Giulia","Giulietta","Stelvio","Tonale","MiTo"],"Audi":["A1","A3","A4","A5","A6","A7","A8","Q2","Q3","Q4 e-tron","Q5","Q7","Q8","TT","R8"],"BMW":["1er","2er","3er","4er","5er","6er","7er","8er","X1","X2","X3","X4","X5","X6","X7","i3","i4","i5","i7","iX","iX1","iX3","Z4"],"BYD":["Atto 3","Atto 3 EVO","Dolphin","Dolphin Surf","Seal","Seal U","Sealion 7","Han","Tang"],"Citroën":["C3","C4","C5 Aircross","Berlingo","Jumpy","Spacetourer"],"Cupra":["Born","Formentor","Leon","Ateca","Terramar","Tavascan"],"Dacia":["Sandero","Duster","Jogger","Spring","Logan"],"DS Automobiles":["DS 3","DS 4","DS 7","DS 9"],"Fiat":["500","500e","Panda","Tipo","Punto","Doblo","Ducato"],"Ford":["Fiesta","Focus","Mondeo","Puma","Kuga","Explorer","Mustang","Ranger","Transit"],"Honda":["Jazz","Civic","HR-V","ZR-V","CR-V","CR-Z"],"Hyundai":["i10","i20","i30","Bayon","Kona","Tucson","Santa Fe","Ioniq 5","Ioniq 6"],"Jaguar":["XE","XF","F-Pace","E-Pace","I-Pace"],"Jeep":["Renegade","Compass","Avenger","Cherokee","Grand Cherokee","Wrangler"],"Kia":["Picanto","Rio","Ceed","XCeed","Niro","Sportage","Sorento","EV3","EV6","EV9"],"Land Rover":["Defender","Discovery","Discovery Sport","Range Rover","Range Rover Sport","Range Rover Evoque"],"Lexus":["LBX","UX","NX","RX","ES","LS"],"Mazda":["2","3","6","CX-3","CX-30","CX-5","CX-60","MX-5"],"Iveco":["Daily","Eurocargo","S-Way","X-Way","T-Way"],"MAN":["TGE","TGL","TGM","TGS","TGX","eTGE"],"DAF":["LF","XD","XF","XG","XG+"],"Mercedes-Benz":["A-Klasse","B-Klasse","C-Klasse","E-Klasse","S-Klasse","CLA","CLE","GLA","GLB","GLC","GLE","GLS","EQA","EQB","EQE","EQS","Sprinter","Vito"],"MG":["MG3","ZS","HS","4","5","Marvel R","Cyberster"],"Mini":["Cooper","Clubman","Countryman","Aceman"],"Mitsubishi":["Space Star","ASX","Eclipse Cross","Outlander"],"Nissan":["Micra","Juke","Qashqai","X-Trail","Ariya","Leaf","Navara"],"Opel":["Corsa","Astra","Mokka","Crossland","Grandland","Insignia","Combo","Vivaro","Zafira"],"Peugeot":["108","208","308","408","508","2008","3008","5008","Partner","Expert"],"Polestar":["2","3","4"],"Porsche":["718 Cayman","718 Boxster","911","Taycan","Macan","Cayenne","Panamera"],"Renault":["Clio","Captur","Megane","Austral","Arkana","Espace","Scenic","Zoe","Kangoo","Trafic"],"Seat":["Ibiza","Leon","Arona","Ateca","Tarraco","Alhambra"],"Škoda":["Fabia","Scala","Octavia","Superb","Kamiq","Karoq","Kodiaq","Enyaq"],"Smart":["fortwo","forfour","#1","#3"],"Subaru":["Impreza","XV","Forester","Outback","Solterra","BRZ"],"Suzuki":["Swift","Ignis","Vitara","S-Cross","Across","Jimny"],"Tesla":["Model 3","Model S","Model X","Model Y","Cybertruck"],"Toyota":["Aygo","Yaris","Corolla","Camry","C-HR","RAV4","Highlander","Land Cruiser","Prius","bZ4X","Proace"],"Volkswagen":["Polo","Golf","Passat","T-Roc","T-Cross","Tiguan","Touareg","Touran","Caddy","Transporter","ID.3","ID.4","ID.5","ID.7","ID.Buzz"],"Volvo":["S60","S90","V60","V90","XC40","XC60","XC90","EX30","EX40","EX90"]};
const DAMAGE_PARTS=["Frontscheibe","Heckscheibe","Seitenscheibe vorne links","Seitenscheibe vorne rechts","Seitenscheibe hinten links","Seitenscheibe hinten rechts","Scheinwerfer links","Scheinwerfer rechts","Nebelscheinwerfer links","Nebelscheinwerfer rechts","Rückleuchte links","Rückleuchte rechts","Stoßfänger vorne","Stoßfänger hinten","Motorhaube","Kühlergrill","Kühler","Kotflügel vorne links","Kotflügel vorne rechts","Radhausschale vorne links","Radhausschale vorne rechts","Tür vorne links","Tür vorne rechts","Tür hinten links","Tür hinten rechts","Türverkleidung vorne links","Türverkleidung vorne rechts","Türverkleidung hinten links","Türverkleidung hinten rechts","Türgriff außen links","Türgriff außen rechts","Türgriff innen links","Türgriff innen rechts","Fensterheber","Außenspiegel links","Außenspiegel rechts","Spiegelglas links","Spiegelglas rechts","Seitenteil hinten links","Seitenteil hinten rechts","Schweller links","Schweller rechts","Heckklappe / Heckdeckel","Heckscheibenwischer","Heckblech","Dach","Dachreling","A-Säule links","A-Säule rechts","B-Säule links","B-Säule rechts","C-Säule links","C-Säule rechts","Windlauf","Unterboden","Unterfahrschutz","Radlauf links","Radlauf rechts","Felgen VL","Felgen VR","Felgen HL","Felgen HR","Reifen VL","Reifen VR","Reifen HL","Reifen HR","Bremsscheibe VL","Bremsscheibe VR","Bremsscheibe HL","Bremsscheibe HR","Bremssattel VL","Bremssattel VR","Bremssattel HL","Bremssattel HR","Querlenker","Achsschenkel","Auspuffanlage","Kraftstofftank","Ladeanschluss","Ladeklappe","Batterie","Lenkrad","Airbag Lenkrad","Instrumententafel / Kombiinstrument","Armaturenbrett","Mittelkonsole","Infotainment / Radio","Display / Zentraldisplay","Klimabedienteil","Handschuhfach","Fahrersitz","Beifahrersitz","Rücksitzbank","Sitzverstellung","Sicherheitsgurt vorne links","Sicherheitsgurt vorne rechts","Sicherheitsgurt hinten links","Sicherheitsgurt hinten rechts","Innenraumverkleidung","Dachhimmel","Kofferraumboden","Kofferraumverkleidung","Teppich / Bodenbelag","Pedale","Schalt-/Wählhebel","Innenbeleuchtung","Kennzeichenhalter","Sonstiges"];
function makeOptions(selected=''){return '<option value="">Bitte Marke auswählen</option>'+CAR_MAKES.map(v=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(v)}</option>`).join('')}
function updateModels(selected=''){const m=document.getElementById('make')?.value||'';const sel=document.getElementById('model');if(!sel)return;const arr=CAR_MODELS[m]||[];sel.innerHTML='<option value="">'+(arr.length?'Modell auswählen':'Modell manuell eingeben')+'</option>'+arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')+'<option value="__custom">Anderes Modell…</option>';if(selected&&arr.includes(selected)){sel.value=selected;document.getElementById('modelCustom')?.classList.add('hidden')}else if(selected){sel.value='__custom';document.getElementById('modelCustom')?.classList.remove('hidden')}else{document.getElementById('modelCustom')?.classList.add('hidden')}}
function modelChanged(){const sel=document.getElementById('model');document.getElementById('modelCustom')?.classList.toggle('hidden',sel?.value!=='__custom')}
function modelValue(){const sel=document.getElementById('model');return sel?.value==='__custom'?(document.getElementById('modelCustom')?.value||'').trim():(sel?.value||'').trim()}
function filterDamageParts(){const q=(document.getElementById('damagePartSearch')?.value||'').toLowerCase().trim();const sel=document.getElementById('damagePartSelect');if(!sel)return;const arr=DAMAGE_PARTS.filter(v=>v.toLowerCase().includes(q));sel.innerHTML='<option value="">'+(arr.length?'Bauteil auswählen':'Kein Bauteil gefunden')+'</option>'+arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function home(){
app.innerHTML=`<h1>BesichtigungsApp</h1><div class="muted">Deine digitale Besichtigungsakte</div>
<div class="card"><h2>🚗 Neue Besichtigung</h2><p class="muted">Fahrzeug, Schaden, Reifen, Fotos, Arbeitszeit und Notizen erfassen.</p><button class="primary" onclick="editInspection()">➕ Neue Besichtigung</button></div>
<div class="card"><h2>📋 Gespeicherte Besichtigungen</h2><div class="total">${db.inspections.length}</div><div class="muted">Besichtigungen gespeichert</div><br><button class="secondary" onclick="listInspections()">Ansehen & bearbeiten</button></div>
<div class="card"><h2>🏭 Werkstätten</h2><div class="muted">${db.workshops.length} Werkstätten gespeichert</div><br><button class="secondary" onclick="listWorkshops()">Werkstätten verwalten</button></div>`;
}
function listWorkshops(){
app.innerHTML=`<div class="topbar"><h2>🏭 Werkstätten</h2><div class="spacer"></div><button class="primary small" onclick="editWorkshop()">➕ Neu</button></div>
${db.workshops.length?db.workshops.map((w,i)=>`<div class="item"><strong>${esc(w.name)}</strong><div class="muted">${esc(w.address||'')}${w.email?' · ✉️ '+esc(w.email):''}</div><div class="row" style="margin-top:8px"><button class="secondary small" onclick="editWorkshop(${i})">✏️ Bearbeiten</button><button class="danger small" onclick="deleteWorkshop(${i})">🗑️ Löschen</button></div></div>`).join(''):'<div class="card muted">Noch keine Werkstatt angelegt.</div>'}`;
}
function editWorkshop(i=null){
let w=i==null?{}:db.workshops[i];
app.innerHTML=`<div class="topbar"><button class="secondary" onclick="listWorkshops()">←</button><h2>${i==null?'Neue Werkstatt':'Werkstatt bearbeiten'}</h2></div>
<div class="card"><label>Werkstattname</label><input id="wn" value="${esc(w.name)}"><label>Ansprechpartner</label><input id="wp" value="${esc(w.contact)}"><label>Adresse</label><input id="wa" value="${esc(w.address)}"><label>Telefon</label><input id="wt" value="${esc(w.phone)}"><label>E-Mail</label><input id="we" type="email" value="${esc(w.email)}">
<h3>Stundensätze</h3><div class="grid3"><div><label>Spengler €</label><input id="ws" type="number" step=".01" value="${w.spengler??''}"></div><div><label>Lackierer €</label><input id="wl" type="number" step=".01" value="${w.lackierer??''}"></div><div><label>Mechanik €</label><input id="wm" type="number" step=".01" value="${w.mechanik??''}"></div></div>
<br><button class="primary" onclick="saveWorkshop(${i==null?'null':i})">💾 Werkstatt speichern</button></div>`;
}
function saveWorkshop(i){
let w={name:wn.value.trim(),contact:wp.value.trim(),address:wa.value.trim(),phone:wt.value.trim(),email:we.value.trim(),spengler:+ws.value||0,lackierer:+wl.value||0,mechanik:+wm.value||0};
if(!w.name){alert("Bitte Werkstattname eingeben.");return} if(i===null) db.workshops.push(w); else db.workshops[i]=w; save(); listWorkshops();
}
function deleteWorkshop(i){if(confirm("Werkstatt wirklich löschen?")){db.workshops.splice(i,1);save();listWorkshops()}}
function listInspections(){
app.innerHTML=`<div class="topbar"><h2>📋 Meine Besichtigungen</h2><div class="spacer"></div><button class="primary small" onclick="editInspection()">➕ Neu</button></div>
<div class="card"><input id="search" placeholder="🔍 Kennzeichen, Werkstatt, Fahrzeug..." oninput="renderInspections()"></div><div id="ilist"></div>`;renderInspections();
}
function renderInspections(){
let q=(document.getElementById('search')?.value||'').toLowerCase();
let arr=db.inspections.map((x,i)=>({...x,_i:i})).filter(x=>(`${x.plate} ${x.make} ${x.model} ${x.workshopName} ${x.damage}`.toLowerCase().includes(q))).reverse();
ilist.innerHTML=arr.length?arr.map(x=>`<div class="item"><strong>${esc(x.make)} ${esc(x.model)} – ${esc(x.plate)}</strong><div class="muted">🏭 ${esc(x.workshopName||'—')} · 📅 ${esc(x.datetime||'—')}</div><span class="pill">${esc(x.damage||'Schaden nicht angegeben')}</span><span class="pill">📷 ${(x.photos||[]).length}</span>
<div class="row" style="margin-top:9px"><button class="secondary small" onclick="viewInspection(${x._i})">👁️ Ansehen</button><button class="secondary small" onclick="editInspection(${x._i})">✏️ Bearbeiten</button><button class="danger small" onclick="deleteInspection(${x._i})">🗑️ Löschen</button></div></div>`).join(''):'<div class="card muted">Keine Besichtigungen gefunden.</div>';
}
function deleteInspection(i){if(confirm("Besichtigung inklusive Fotos wirklich löschen?")){db.inspections.splice(i,1);save();listInspections()}}
function editInspection(i=null){
let x=i==null?{}:db.inspections[i];currentPhotos=normalizePhotos(x.photos);
let options='<option value="">Werkstatt auswählen</option>'+db.workshops.map((w,j)=>`<option value="${j}" ${String(x.workshopIndex)===String(j)?'selected':''}>${esc(w.name)}</option>`).join('');
app.innerHTML=`<div class="topbar"><button class="secondary" onclick="${i==null?'home()':'listInspections()'}">←</button><h2>${i==null?'Neue Besichtigung':'Besichtigung bearbeiten'}</h2></div>
<div class="card"><h3>📄 Gutachten</h3><label>Gutachten-Nr.</label><input id="gutachtenNr" value="${esc(x.gutachtenNr||nextGutachtenNr())}" placeholder="z. B. GA-2026-0001"><p class="muted">Die Nummer wird automatisch vorgeschlagen und kann geändert werden.</p><h3>🏭 Werkstatt</h3><select id="wi" onchange="fillRates()">${options}</select><div id="winfo" class="muted" style="margin-top:7px"></div>
<h3>🚗 Fahrzeug</h3><div class="grid"><div><label>Kennzeichen</label><input id="plate" value="${esc(x.plate)}"></div><div><label>Marke</label><select id="make" onchange="updateModels()">${makeOptions(x.make)}</select></div><div><label>Modell</label><select id="model" onchange="modelChanged()"></select><input id="modelCustom" class="hidden" placeholder="Modell manuell eingeben" value="${esc(x.model)}"></div><div><label>Erstzulassung</label><input id="firstRegistration" type="date" value="${esc(x.firstRegistration||x.year||'')}"></div><div><label>Gesamtgewicht</label><input id="weight" type="number" min="0" step="1" value="${esc(x.weight||'')}" placeholder="kg"></div><div><label>Höchstzulässiges Gesamtgewicht</label><input id="maxWeight" type="number" min="0" step="1" value="${esc(x.maxWeight||'')}" placeholder="kg"></div><div><label>FIN</label><input id="vin" value="${esc(x.vin)}"></div><div><label>Kilometerstand</label><input id="km" type="number" value="${esc(x.km)}"></div><div><label>Tankfüllstand %</label><input id="fuel" type="number" min="0" max="100" value="${esc(x.fuel)}"></div><div><label>Datum & Uhrzeit</label><input id="datetime" type="datetime-local" value="${esc(x.datetime||new Date().toISOString().slice(0,16))}"></div></div>
<h3>⚠️ Schaden</h3><label>Schadensart</label><select id="damage"><option value="">Bitte auswählen</option>${['Kollision','Parkschaden','Hagelschaden','Vandalismus','Wildschaden','Glasbruch','Elementarschaden','Sonstiger Schaden'].map(v=>`<option ${x.damage===v?'selected':''}>${v}</option>`).join('')}</select><label>Schadensbeschreibung</label><textarea id="desc">${esc(x.desc)}</textarea><button class="secondary" onclick="speak('desc')">🎤 Spracheingabe</button>
<h3>⚠️ Bauteile / Schäden</h3>
<div class="damage-toolbar"><div><label>🔎 Bauteil suchen</label><input id="damagePartSearch" placeholder="z. B. Lenkrad, Türverkleidung, Scheinwerfer…" oninput="filterDamageParts()"><label>Bauteil auswählen</label><select id="damagePartSelect"><option value="">Bitte Bauteil auswählen</option>${DAMAGE_PARTS.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div><button class="secondary" onclick="addDamagePart()">➕ Bauteil hinzufügen</button></div>

let selectedPhotoCategory="Schaden";

function takePhotoForCategory(category){
  selectedPhotoCategory = category;
  let inp = document.getElementById("quickPhotoInput");
  if(!inp){
    inp = document.createElement("input");
    inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.id="quickPhotoInput"; inp.style.display="none";
    inp.onchange=()=>{ if(inp.files && inp.files.length) addPhotos(inp.files); inp.value=""; };
    document.body.appendChild(inp);
  }
  inp.click();
}
function categoryCard(category, photos){
  const arr=photos||[];
  return `<div class="photoCatCard">
    <div class="photoCatHead"><strong>${esc(category)}</strong><span>${arr.length} Foto${arr.length===1?'':'s'}</span></div>
    <button class="cameraBtn" onclick="takePhotoForCategory('${esc(category)}')">📷 Foto aufnehmen</button>
    ${arr.length?`<div class="photoGrid">${arr.map(p=>`<div><img src="${p.src}" onclick="openPhoto('${p.src}')"><button class="secondary small" style="width:100%;margin-top:3px" onclick="saveToPhonePhotos('${p.src}','${esc(p.category)}')">💾 In Fotos speichern</button></div>`).join('')}</div>`:'<div class="muted emptyCat">Noch kein Foto</div>'}
  </div>`;
}

function addCategorizedPhoto(dataUrl, category){
currentPhotos.push({src:dataUrl,category});
renderPhotoEdit();
}
function normalizePhotos(arr){
return (arr||[]).map(p=>typeof p==="string"?{src:p,category:"Schaden"}:p);
}

async function saveToPhonePhotos(src, category){
  try{
    const res=await fetch(src);
    const blob=await res.blob();
    const file=new File([blob],`BesichtigungsApp_${(category||"Foto").replace(/[^a-z0-9äöüÄÖÜ _-]/gi,"_")}_${Date.now()}.jpg`,{type:blob.type||"image/jpeg"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Foto speichern",text:`BesichtigungsApp – ${category||"Foto"}`});
      return;
    }
    // iOS fallback: open the image; user can long-press and choose "Zu Fotos hinzufügen".
    openPhoto(src);
    alert("Das Foto wurde geöffnet. Auf dem iPhone das Bild gedrückt halten und „Zu Fotos hinzufügen“ wählen.");
  }catch(e){
    openPhoto(src);
    alert("Bitte das geöffnete Foto gedrückt halten und „Zu Fotos hinzufügen“ wählen.");
  }
}

function downloadPhoto(src, category){
const a=document.createElement("a");a.href=src;a.download=`BesichtigungsApp_${(category||"Foto").replace(/[^a-z0-9äöüÄÖÜ _-]/gi,"_")}_${Date.now()}.jpg`;document.body.appendChild(a);a.click();a.remove();
}
function openPhoto(src){
const w=window.open(); if(w){w.document.write(`<html><body style="margin:0;background:#111;display:grid;place-items:center"><img src="${src}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);w.document.close();}
}
function photosByCategory(arr){
const m={};normalizePhotos(arr).forEach(p=>(m[p.category]??=[]).push(p));return m;
}

function addPhotos(files){
[...files].forEach(f=>{let r=new FileReader();r.onload=e=>addCategorizedPhoto(e.target.result,selectedPhotoCategory);r.readAsDataURL(f)})
}
function renderPhotoEdit(){

  photoEdit.innerHTML=wanted.map(cat=>categoryCard(cat,groups[cat]||[])).join('');
}
const DAMAGE_TYPES=["Kratzer","Delle","Riss","Loch","Steinschlag","Bruch","Verformung","Lackschaden","Korrosion","Sonstiger Schaden"];

function loadDamageItems(x){
  if(Array.isArray(x.damageItems)) return x.damageItems.map(d=>({...d}));
  const old=x.status||{};
  return Object.entries(old).filter(([_,st])=>typeof st==='object'?st.checked:!!st).map(([part,st])=>({part,action:typeof st==='object'?(st.action||'Reparieren'):'Reparieren',type:'',paint:'',note:''}));
}
function addDamagePart(){

}

<div class="no-print" style="margin-bottom:12px"><button onclick="window.print()">🖨️ Drucken / Als PDF sichern</button></div>
<div class="report-head"><div><div class="report-logo">BesichtigungsApp</div><div>Fahrzeugschadengutachten</div></div><div class="report-meta"><b>Gutachten-Nr.</b><br>${esc(x.gutachtenNr||'—')}<br><br><b>Besichtigungsdatum</b><br>${esc(x.datetime||'—')}</div></div>
${sections}
${mode==='full'?'<div class="sign"><div>Unterschrift / Sachverständiger</div><div>Ort / Datum</div></div>':''}
</body></html>`);
  report.document.close();
}

function speak(id){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Spracheingabe wird von diesem Browser nicht unterstützt.");return}
let r=new SR();r.lang='de-AT';r.interimResults=false;r.onresult=e=>{document.getElementById(id).value+=(document.getElementById(id).value?' ':'')+e.results[0][0].transcript};r.start();
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
home();
